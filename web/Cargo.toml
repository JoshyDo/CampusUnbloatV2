[package]
name = "campusunbloat-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
campusunbloat-shared = { path = "../shared" }
chrono = { version = "0.4", features = ["wasmbind"] }
gloo-net = { version = "0.6", features = ["http"] }
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["CanvasRenderingContext2d", "Document", "Element", "HtmlAnchorElement", "HtmlCanvasElement", "TextMetrics", "console", "HtmlInputElement", "HtmlSelectElement", "Storage", "Window"] }
yew = { version = "0.21", features = ["csr"] }
