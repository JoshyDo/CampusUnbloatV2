[package]
name = "campusunbloat-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
campusunbloat-shared = { path = "../shared" }
chrono = { version = "0.4", features = ["serde"] }
cookie_store = "0.22"
fnv = "1.0"
lazy_static = "1.5"
log = "0.4"
mensa-api = { path = "../mensa" }
pretty_env_logger = "0.5"
rand = "0.10"
regex = "1.10"
reqwest = { version = "0.13", features = ["cookies", "json", "rustls", "form"], default-features = false }
reqwest_cookie_store = { version = "0.10", features = ["serde"] }
scraper = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7", features = ["fs"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
